<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Social card for referral links (/?ref=CODE). Render with:
     pnpm shot --url file://$(pwd)/scripts/og/og-invite.html --viewport 1200x630 --dpr 1 --out public/og-invite.png -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@400;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(900px 500px at 85% -10%, #efe2d2 0%, transparent 60%),
      radial-gradient(700px 460px at -5% 110%, #e6d9ec 0%, transparent 55%),
      #f4efe4;
    font-family: Karla, sans-serif;
    color: #3d3427;
    display: flex;
    align-items: center;
    padding: 0 84px;
    overflow: hidden;
  }
  .cups { position: relative; width: 430px; height: 420px; flex: none; }
  .words { padding-left: 64px; }
  h1 {
    font-family: "Young Serif", serif;
    font-size: 64px;
    line-height: 1.12;
    font-weight: 400;
    color: #443a2b;
    margin-bottom: 26px;
  }
  p { font-size: 27px; line-height: 1.45; color: #6d6252; max-width: 520px; }
  .brand { display: flex; align-items: center; gap: 14px; margin-top: 40px; }
  .brand span { font-family: "Young Serif", serif; font-size: 30px; color: #443a2b; }
  .saucer-line { stroke: #7b5a3c; stroke-width: 7; stroke-linecap: round; }
</style>
</head>
<body>
  <div class="cups">
    <svg viewBox="0 0 430 420" width="430" height="420" fill="none">
      <!-- steam over the full cup -->
      <g stroke="#a99bd1" stroke-width="7" stroke-linecap="round" opacity="0.85">
        <path d="M120 96 C 108 76, 132 62, 120 42" />
        <path d="M152 88 C 140 68, 164 54, 152 34" opacity="0.65" />
      </g>
      <!-- full cup, tea steaming -->
      <g>
        <path d="M52 140 h172 v54 a86 86 0 0 1 -172 0 z" fill="#f9f5ec" stroke="#7b5a3c" stroke-width="7"/>
        <path d="M60 150 h156 v42 a78 78 0 0 1 -156 0 z" fill="#b3763f"/>
        <path d="M60 150 h156 v14 a78 40 0 0 1 -156 0 z" fill="#c98d52" opacity="0.85"/>
        <path d="M224 154 c 36 -4, 44 46, -2 52" stroke="#7b5a3c" stroke-width="7" fill="none"/>
        <line x1="34" y1="286" x2="242" y2="286" class="saucer-line"/>
      </g>
      <!-- empty cup, the saved seat -->
      <g opacity="0.9">
        <path d="M238 232 h150 v46 a75 75 0 0 1 -150 0 z" fill="#f9f5ec" stroke="#9b8a72" stroke-width="7"/>
        <path d="M388 244 c 32 -3, 38 40, -2 45" stroke="#9b8a72" stroke-width="7" fill="none"/>
        <line x1="222" y1="360" x2="404" y2="360" stroke="#9b8a72" stroke-width="7" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
  <div class="words">
    <h1>A seat's been saved<br/>for you.</h1>
    <p>A friend set a place at the tea table. The cups earn while they steep, and your first pour pays you both a little extra.</p>
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="#8a77c7" opacity="0.25"/><circle cx="17" cy="17" r="9" fill="#b3763f"/></svg>
      <span>LSTeaTime</span>
    </div>
  </div>
</body>
</html>
